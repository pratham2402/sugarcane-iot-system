# Sugarcane Field Monitoring — Cloud Backend Configuration
# ───────────────────────────────────────────────────────

server:
  host: "0.0.0.0"
  port: 8000
  debug: true
  title: "Sugarcane Field Monitoring API"
  version: "1.0.0"

database:
  # SQLite for MVP — swap to PostgreSQL URI for production
  url: "sqlite:///data/telemetry.db"
  # For PostgreSQL: "postgresql://user:pass@host:5432/sugarcane"

api:
  # Maximum readings per batch ingest request
  max_batch_size: 100
  # Rate limiting (future)
  # rate_limit: 100  # requests per minute per gateway
